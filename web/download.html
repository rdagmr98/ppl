<script>
/* Redirect automatico per piattaforma (Android -> Play Store, iOS -> Web App).
   Eseguito subito: chi scansiona il QR da mobile non vede mai questa pagina. */
(function(){
  var ua = navigator.userAgent || navigator.vendor || window.opera || '';
  var ANDROID = 'https://play.google.com/store/apps/details?id=com.a_ppl';
  var IOS = 'https://rdagmr98.github.io/ppl/';
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /android/i.test(ua);
  if (isAndroid) { location.replace(ANDROID); }
  else if (isIOS) { location.replace(IOS); }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0A0E14;
  --panel:#111826;
  --panel-2:#161F30;
  --line-strong:rgba(234,241,248,.16);
  --text:#EAF1F8;
  --text-dim:#8E9AB0;
  --text-faint:#5B6579;
  --blue:#1E88E5;
  --blue-soft:#5DA9EA;
  --blue-glow:rgba(30,136,229,.45);
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Sora',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.75,.13,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
  background:var(--bg);color:var(--text);font-family:var(--body);padding:28px;
  background-image:radial-gradient(60% 45% at 50% 0%,rgba(30,136,229,.2),transparent 60%);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.box{max-width:420px;width:100%}
.logo{width:88px;height:88px;margin:0 auto 20px;border-radius:24px;overflow:hidden;
  border:1px solid rgba(30,136,229,.3);box-shadow:0 0 32px var(--blue-glow)}
.logo img{width:100%;height:100%;display:block}
.wm{font-family:var(--disp);font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.wm b{color:var(--blue-soft)}
.sub{color:var(--text-dim);font-size:15px;margin-bottom:30px}
.btns{display:flex;flex-direction:column;gap:14px}
.btn{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);text-align:left;
  padding:16px 20px;border-radius:18px;border:1px solid var(--line-strong);background:var(--panel-2);
  transition:transform .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease)}
.btn:hover{transform:translateY(-2px);border-color:var(--blue-soft);box-shadow:0 14px 30px -10px var(--blue-glow)}
.btn .ic{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center}
.btn .ic svg{width:24px;height:24px;fill:var(--text)}
.btn .t{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0}
.btn .t small{font-size:11.5px;opacity:.75;font-weight:600}
.btn .t span{font-size:17px;font-weight:800}
.btn .tag{font-family:var(--body);font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;
  background:rgba(30,136,229,.14);color:var(--blue-soft);border:1px solid rgba(30,136,229,.3);flex:none}
.qr{margin-top:26px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;
  border:1px solid var(--line-strong);background:var(--panel);text-align:left}
.qr img{width:64px;height:64px;border-radius:8px;background:#fff;padding:4px;flex:none}
.qr span{font-size:12.5px;color:var(--text-dim);line-height:1.45}
.note{margin-top:22px;color:var(--text-faint);font-size:12px}
.note a{color:var(--text-dim);text-decoration:none}
.note a:hover{color:var(--text)}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><img src="icons/Icon-192.png" alt=""></div>
  <div class="wm">Quiz <b>PPL</b></div>
  <div class="sub">Scegli il tuo dispositivo per iniziare</div>
  <div class="btns">
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.a_ppl">
      <div class="ic">

          <path fill="#FFD500" d="M17.1 9.36l-3.23-1.86-2.7 2.7 2.7 2.7 3.25-1.87c.93-.53.93-1.4-.02-1.67"/>

      </div>
      <span class="t"><small>Android · Google Play</small><span>Scarica l'app</span></span>

    </a>
    <a class="btn" href="https://rdagmr98.github.io/ppl/">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M16.36 12.7c.02 2.42 2.12 3.22 2.14 3.23-.02.05-.34 1.16-1.11 2.3-.66.99-1.35 1.97-2.43 1.99-1.06.02-1.4-.63-2.62-.63-1.21 0-1.59.61-2.6.65-1.04.04-1.84-1.07-2.51-2.05-1.36-1.98-2.4-5.6-1-8.04.69-1.21 1.93-1.98 3.28-2 1.03-.02 2 .69 2.62.69.62 0 1.81-.86 3.05-.73.52.02 1.98.21 2.91 1.58-.07.05-1.74 1.02-1.72 3.04M14.4 6.6c.55-.66.92-1.59.82-2.51-.79.03-1.75.53-2.32 1.19-.51.58-.96 1.52-.84 2.42.88.07 1.78-.45 2.34-1.1"/></svg></div>
      <span class="t"><small>iPhone · iPad</small><span>Apri la Web App</span></span>
      <span class="tag">Gratis</span>
    </a>
  </div>
  <div class="qr">
    <img src="qr-download.png" alt="QR di questa pagina">
    <span>Sei al computer? Inquadra il QR con il telefono: vai dritto allo scaricamento.</span>
  </div>
  <div class="note">Domande reali del pool ufficiale ENAC/EASA · <a href="privacy.html">Privacy Policy</a></div>
</div>
</body>
</html>

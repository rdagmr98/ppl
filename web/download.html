<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<script>
/* Redirect automatico per piattaforma (iOS -> Web App, Android -> Play Store test chiuso).
   Eseguito subito: gli utenti mobile non vedono mai il fallback. */
(function(){
  var ua = navigator.userAgent || navigator.vendor || window.opera || '';
  var ANDROID = 'https://play.google.com/apps/testing/com.a_ppl';
  var IOS = 'https://rdagmr98.github.io/ppl/';
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /android/i.test(ua);
  if (isAndroid) { location.replace(ANDROID); }
  else if (isIOS) { location.replace(IOS); }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scarica Quiz PPL</title>
<meta name="description" content="Scarica Quiz PPL(A): iPhone/iPad come Web App, Android in test chiuso su Google Play.">
<meta name="theme-color" content="#0E1116">
<meta name="robots" content="noindex">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
  background:#0E1116;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:28px;
  background-image:radial-gradient(60% 45% at 50% 0%,rgba(30,136,229,.22),transparent 60%)}
.box{max-width:430px;width:100%}
.logo{width:88px;height:88px;margin:0 auto 18px;display:grid;place-items:center;border-radius:22px;
  background:linear-gradient(160deg,#141a24,#05070a);border:1px solid rgba(30,136,229,.3);
  box-shadow:0 0 32px rgba(30,136,229,.4);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.wm{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.wm b{color:#1E88E5;text-shadow:0 0 18px rgba(30,136,229,.6)}
.sub{color:#9aa1ad;font-size:15px;margin-bottom:30px}
.btns{display:flex;flex-direction:column;gap:14px}
.btn{display:flex;align-items:center;gap:14px;justify-content:flex-start;text-align:left;text-decoration:none;color:#fff;
  padding:15px 20px;border-radius:16px;border:1px solid rgba(30,136,229,.25);
  background:linear-gradient(180deg,#141a24,#0a0d12);transition:.2s}
.btn:hover{border-color:#1E88E5;box-shadow:0 0 26px rgba(30,136,229,.35);transform:translateY(-2px)}
.btn.primary{background:#1E88E5;color:#051019;border-color:#1E88E5;box-shadow:0 0 26px rgba(30,136,229,.45)}
.btn svg{width:30px;height:30px;flex:none;fill:#1E88E5}
.btn.primary svg{fill:#051019}
.btn .t{display:flex;flex-direction:column;line-height:1.2}
.btn .t small{font-size:12px;opacity:.7;font-weight:600}
.btn .t span{font-size:18px;font-weight:800}
.btn .tag{margin-left:auto;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;
  background:rgba(30,136,229,.16);color:#1E88E5;border:1px solid rgba(30,136,229,.35)}
.btn.primary .tag{background:rgba(5,16,25,.18);color:#051019;border-color:rgba(5,16,25,.25)}
.note{margin-top:22px;color:#6b727d;font-size:12.5px}
.redir{margin-bottom:18px;color:#1E88E5;font-size:13px;font-weight:700;display:none}
</style>
</head>
<body>
<div class="box">

      <span class="t"><small>iPhone · iPad · Web App</small><span>Apri la Web App</span></span>
      <span class="tag">Gratis</span>
    </a>
    <a class="btn primary" href="https://play.google.com/apps/testing/com.a_ppl">
      <svg viewBox="0 0 24 24"><path d="M3.6 2.3c-.32.18-.5.55-.5 1.05v17.3c0 .5.18.87.5 1.05l.06.03 9.7-9.7v-.06zM17.1 9.36l-3.23-1.86-2.7 2.7 2.7 2.7 3.25-1.87c.93-.53.93-1.4-.02-1.67M5.5 1.9l7.8 4.5 2.18-2.18zM5.5 22.1l9.98-5.76-2.18-2.18z"/></svg>
      <span class="t"><small>Android · Google Play</small><span>Entra nel test chiuso</span></span>
      <span class="tag">Beta</span>

  </div>
  <div class="note">iPhone come Web App, gratis · Android in test chiuso: serve l'invito come tester Google Play</div>
</div>

</html>
